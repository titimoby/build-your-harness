# SLF4J simple logger, shared by every step (//FILES): logs never go to the console.
# With --inspect, LangChain4j logs the raw JSON here: watch it with `tail -F inspect.log`.
org.slf4j.simpleLogger.logFile=inspect.log
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
